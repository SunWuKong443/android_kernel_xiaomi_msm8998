name: Build Kernel - 14.0-Nanhumly

on:
  push:
    branches: [ "14.0-Nanhumly" ]
    paths-ignore:
      - '**.md'
      - 'Documentation/**'
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: 检出内核源码
        uses: actions/checkout@v4
        with:
          ref: 14.0-Nanhumly
          submodules: recursive
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 curl git zip unzip cpio

      - name: 配置Android NDK工具链
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true
      - name: 下载 KernelSU-Next next分支 到内核源码根目录，移动到drivers/kernelsu
        run: |
          # 克隆KernelSU-Next到临时文件夹
          git clone -b dev --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git          # 如果旧文件夹存在先删除
      - name: 内核配置
        run: |
          export ARCH=arm64
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu
          make sagit_defconfig

      - name: 编译内核与驱动模块
        run: |
          export ARCH=arm64
          export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          # NDK clang：CROSS_COMPILE 不要赋值！避免寻找 *‑gcc
          export CROSS_COMPILE=
          export CROSS_COMPILE_ARM32=
          export CC=clang
          export CXX=clang++
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-android
          make sagit_defconfig
          make -j$(nproc) Image.gz-dtb dtbo.img modules

      - name: 收集并打包产物
        run: |
          mkdir -p kernel_out/modules
          cp arch/arm64/boot/Image.gz-dtb kernel_out/
          cp arch/arm64/boot/dtbo.img kernel_out/
          find drivers -name "*.ko" -exec cp {} kernel_out/modules/ \;
          cd kernel_out && zip -r ../kernel-14.0-nanhumly.zip ./*

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-14.0-nanhumly
          path: kernel-14.0-nanhumly.zip
          retention-days: 30
